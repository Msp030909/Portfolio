<head>
    <title>JOIN OUR TEAM (FRACTURED)</title>

</head>
<body>
    <br>
    <h1>JOIN OUR TEAM</h1>
    Fill out this quick survey to apply for our team!
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>

    <form>
        <!--The survey now matters-->
        <label for="fName">First name:</label>
        <input type="text" id="fName" name="fName">
        <br>
        <br>
        <label for="lName">Last name:</label>
        <input type="text" id="lName" name="lName">
        <br>
        <br>
        <label for="experience">How many years of experience do you have?</label>
        <select id="experience" name="experience">
            <optgroup label="Possibly Inadequate">
            <option value="50">50</option>
            <option value="60">60</option>
            </optgroup>
            <optgroup label="Bare Minimum">
            <option value="70">70</option>
            <option value="80">80</option>
            </optgroup>
        </select>
        <br>
        <br>
        <label for="kills">What is your average K/D ratio in multplayer games?</label>
        <br>
        <br>
        <input id="kills" type="number"> / <input id="deaths" type="number" > 
        <br>
        <br>
        <label for="opinion" for="opinion2">What is your opinion on the Metal Gear Solid Franchise?</label>
        <br>
        <br>
        <input type="radio" name="answer" id="opinion"> It's amazing, I love it
        <br>
        <input type="radio" name="answer" id="opinion2"> It's amazing, I love it
        <br>
        <br>
        <label for="videogame">Videogame?</label>
        <br>
        <br>
        <select id="videogame" name="videogame">
            <option value="yes">Yes</option>
            <option value="yes">Yes, I agree</option>
            <option value="yes">Of course</option>
            <option value="yes">Clearly</option>
        </select>
        <br>
        <br>
        <br>
      </form>
      <a href="FRACTUREDfailure.html">
        <button class="button" id="button">
            <strong>Submit</strong>
        </button>
      </a>

        <br>

</body>
